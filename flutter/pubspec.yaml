name: aventoria
description: Aventoria RPG — Flutter port of the Godot project.
publish_to: "none"
version: 1.0.24+25

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  audioplayers: ^5.2.1
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  url_launcher: ^6.2.6
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  archive: ^3.6.1
  image: ^4.2.0
  image_picker: ^1.1.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

