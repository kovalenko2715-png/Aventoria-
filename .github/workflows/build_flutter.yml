name: Build APK

on:
  push:
    branches: ["main", "vibe/flutter-port-a0bddf"]
    paths:
      - "flutter/**"
      - ".github/workflows/build_flutter.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        working-directory: flutter

      - name: Build release APK
        run: flutter build apk --release
        working-directory: flutter

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aventoria-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
      - name: Build debug APK
        run: flutter build apk --debug
        working-directory: flutter

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aventoria-apk-debug
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
